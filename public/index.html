<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252321">
  <title>Bend &amp; Brew Rewards Card</title>
  <style>
    :root { --ink:#252321; --cream:#f8edda; --rust:#b84d32; --muted:#776d61; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px 16px 48px; background:var(--ink); color:var(--cream); font:16px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { max-width:620px; margin:auto; }
    .note { margin:0 auto 18px; color:#cdbda4; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    .ticket { position:relative; padding:32px 26px; background:var(--cream); color:var(--ink); }
    .ticket::before,.ticket::after { content:""; position:absolute; left:0; right:0; height:10px; background:radial-gradient(circle at 5px 0, transparent 5px, var(--ink) 6px) 0 0/18px 10px; }
    .ticket::before { top:-1px; }.ticket::after { bottom:-1px; transform:rotate(180deg); }
    .mast { display:flex; justify-content:space-between; gap:12px; border-bottom:2px dashed currentColor; padding-bottom:18px; }
    .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; max-width:430px; font:700 clamp(42px,11vw,70px)/.88 Georgia, serif; letter-spacing:-.07em; }
    h2 { margin:14px 0 0; font:700 36px/.95 Georgia, serif; letter-spacing:-.05em; }
    .status { display:flex; justify-content:space-between; align-items:end; gap:24px; padding:34px 0; border-bottom:2px dashed currentColor; }
    .status p { margin:14px 0 0; color:var(--muted); }
    .qr { width:128px; aspect-ratio:1; display:grid; place-items:center; flex:none; border:10px solid #fff; background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 50%/16px 16px; color:#222; font-size:11px; font-weight:700; text-align:center; }
    .wallet { padding:22px 0; border-bottom:2px dashed currentColor; }
    .reward { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px; padding:14px; border:1px solid currentColor; }
    .reward small { color:var(--muted); }
    .action { display:flex; flex-wrap:wrap; gap:10px; padding-top:22px; }
    button { border:0; border-radius:2px; padding:13px 16px; background:var(--rust); color:#fff; font:700 14px ui-monospace,monospace; cursor:pointer; }
    button.secondary { background:transparent; color:inherit; border:2px solid currentColor; }
    button:disabled { cursor:not-allowed; opacity:.5; }
    input, select { width:100%; padding:13px; border:2px solid currentColor; border-radius:2px; background:#fffaf0; color:var(--ink); font:16px ui-monospace,monospace; }
    .qr-card { display:flex; align-items:center; gap:18px; margin-top:12px; padding:14px; border:1px solid currentColor; }
    .qr-image { width:150px; height:150px; background:#fff; }
    .scanner { width:100%; margin-top:14px; background:#171615; }
    #scanner-canvas { display:none; }
    .activity { margin-top:24px; padding-top:18px; border-top:2px dashed currentColor; }
    .activity p { color:var(--muted); }
    .staff-panel { padding:24px 0 0; }
    .message { margin:14px 0 0; color:var(--muted); }
    .error { padding:20px; background:#f5c8bb; color:#4b1f17; }
    @media (max-width:520px) { .status { display:block; }.qr { margin-top:24px; }.reward { align-items:start; flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <p class="note">Bend &amp; Brew · Rewards Card</p>
    <section id="app" class="ticket" aria-live="polite">Loading Patrick's card…</section>
  </main>
  <script>
    const app = document.querySelector('#app');
    const esc = value => String(value).replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character]));
    let currentView;
    let mode = 'member';
    let message = '';
    let isRecording = false;
    let revealedReward;
    let staffPreview;
    let staffToken = '';
    let staffAccessCode = '';
    let isConfirming = false;
    let redemptionRequestId;
    let cameraStream;
    let scanActive = false;
    let adjustmentAmount = '';
    let adjustmentReason = '';
    let correctionRewardId = '';
    let correctionReason = '';
    let isAdjusting = false;
    let adjustmentRequestId;
    let isCorrecting = false;
    let correctionRequestId;

    function creditsMarkup(view) {
      return Array.from({ length:8 }, (_, index) => `<span style="display:inline-grid;place-items:center;width:30px;height:30px;margin:12px 5px 0 0;border:2px solid currentColor;border-radius:50%;background:${index < view.drinkCredits ? '#e3a43b' : 'transparent'}">${index < view.drinkCredits ? '✓' : index + 1}</span>`).join('');
    }

    function memberMarkup(view) {
      const reward = view.availableRewards[0];
      return `
        <div class="mast"><strong>BEND &amp; BREW</strong><span>NO. 0042</span></div>
        <div class="status">
          <div><div class="eyebrow">${esc(view.member.name)}</div><h1>A little thank-you for Patrick.</h1><p>${view.drinkCredits} / 8 credits to the next one.</p></div>
          <div class="qr" aria-label="Rewards Card QR">CARD<br>QR</div>
        </div>
        <div class="wallet"><div class="eyebrow">Reward Wallet</div>${reward ? `<div class="reward"><div><strong>${esc(reward.kind)}</strong><br><small>No expiration · available now</small></div><button class="secondary" type="button" data-reveal-reward data-reward-id="${esc(reward.id)}">Use reward</button></div>${revealedReward ? `<div class="qr-card"><img class="qr-image" src="${revealedReward.qrDataUrl}" alt="Reward QR for one free drink"><div><strong>Show this to Staff.</strong><br><small>Expires ${new Date(revealedReward.expiresAt).toLocaleTimeString()}.</small><br><small>Single-use reward QR</small></div></div>` : ''}` : '<p>No rewards in the wallet yet.</p>'}</div>
        <div><div class="eyebrow" style="margin-top:22px">Progress to your next free drink</div><div>${creditsMarkup(view)}</div><p style="color:var(--muted)">${view.creditsToNextReward} credits remaining</p></div>
        <div class="action"><button type="button" disabled>Show my card</button><button class="secondary" type="button" disabled>View activity</button><button class="secondary" type="button" data-mode="staff">Staff view</button></div>
        <p class="message" role="status">${esc(message)}</p>
        <div class="activity"><div class="eyebrow">Recent activity · ${view.lifetimeDrinkCredits} lifetime credits</div>${view.recentActivity.map(item => `<p>${esc(item.label)} · ${esc(item.actor)}</p>`).join('')}</div>`;
    }

    function staffMarkup(view) {
      return `
        <div class="mast"><strong>BEND &amp; BREW</strong><span>STAFF</span></div>
        <div class="status"><div><div class="eyebrow">Staff view</div><h2>Record Patrick's paid drink.</h2><p>Confirm the purchase, then add one Drink Credit.</p></div><div class="qr" aria-label="Staff scan placeholder">SCAN<br>QR</div></div>
        <div class="staff-panel"><div class="eyebrow">Selected Member</div><p><strong>${esc(view.member.name)}</strong><br><span style="color:var(--muted)">${view.drinkCredits} Drink Credits · ${view.availableRewards.length} Free Drink Reward</span></p>
          <label class="eyebrow" for="access-code">Staff Access Code</label><input id="access-code" type="password" autocomplete="off" value="${esc(staffAccessCode)}" placeholder="Enter shared code">
          <label class="eyebrow" for="reward-token" style="display:block;margin-top:18px">Reward QR token or scanned value</label><input id="reward-token" type="text" autocomplete="off" value="${esc(staffToken)}" placeholder="Scan or paste the Reward QR value">
          <div class="action"><button type="button" data-record ${isRecording ? 'disabled' : ''}>${isRecording ? 'Saving…' : 'Record paid drink'}</button><button type="button" data-preview>Preview Redemption</button><button class="secondary" type="button" data-camera>Scan with camera</button><button class="secondary" type="button" data-mode="member">Back to card</button></div>
          <video id="scanner" class="scanner" playsinline hidden></video><canvas id="scanner-canvas"></canvas>
          ${staffPreview ? `<div class="reward" style="margin-top:18px"><div><strong>Redeem one free drink for ${esc(staffPreview.member.name)}?</strong><br><small>${esc(staffPreview.reward.kind)} · expires ${new Date(staffPreview.expiresAt).toLocaleTimeString()}</small></div><button type="button" data-confirm ${isConfirming ? 'disabled' : ''}>${isConfirming ? 'Confirming…' : 'Confirm Redemption'}</button></div>` : ''}
          <div class="staff-panel"><div class="eyebrow">Corrections</div><label class="eyebrow" for="adjustment-amount" style="display:block;margin-top:14px">Credit Adjustment (+/-)</label><input id="adjustment-amount" type="number" step="1" value="${esc(adjustmentAmount)}" placeholder="Example: 1 or -1"><label class="eyebrow" for="adjustment-reason" style="display:block;margin-top:12px">Adjustment reason</label><input id="adjustment-reason" type="text" value="${esc(adjustmentReason)}" placeholder="Explain the correction"><button type="button" data-adjust ${isAdjusting ? 'disabled' : ''} style="margin-top:12px">${isAdjusting ? 'Saving…' : 'Apply Credit Adjustment'}</button>
          <label class="eyebrow" for="correction-reward-id" style="display:block;margin-top:22px">Redeemed Reward</label><select id="correction-reward-id" ${isCorrecting ? 'disabled' : ''}>${view.redeemedRewards.length ? view.redeemedRewards.map(item => `<option value="${esc(item.id)}" ${item.id === correctionRewardId ? 'selected' : ''}>${esc(item.kind)} · ${esc(item.id)}</option>`).join('') : '<option value="">No redeemed rewards</option>'}</select><label class="eyebrow" for="correction-reason" style="display:block;margin-top:12px">Redemption correction reason</label><input id="correction-reason" type="text" value="${esc(correctionReason)}" placeholder="Explain the mistaken redemption"><button type="button" data-correct ${isCorrecting || !view.redeemedRewards.length ? 'disabled' : ''} style="margin-top:12px">${isCorrecting ? 'Saving…' : 'Restore Redeemed Reward'}</button></div>
          <p class="message" role="status">${esc(message)}</p>
        </div>
        <div class="activity"><div class="eyebrow">Recent activity · ${view.lifetimeDrinkCredits} lifetime credits</div>${view.recentActivity.map(item => `<p>${esc(item.label)} · ${esc(item.actor)}</p>`).join('')}</div>`;
    }

    function render(view) {
      currentView = view;
      app.innerHTML = mode === 'member' ? memberMarkup(view) : staffMarkup(view);
      document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => { stopScanner(); mode = button.dataset.mode; message = ''; render(currentView); }));
      document.querySelector('[data-reveal-reward]')?.addEventListener('click', revealReward);
      document.querySelector('[data-record]')?.addEventListener('click', recordPaidDrink);
      document.querySelector('[data-preview]')?.addEventListener('click', previewRedemption);
      document.querySelector('[data-confirm]')?.addEventListener('click', confirmRedemption);
      document.querySelector('[data-camera]')?.addEventListener('click', scanWithCamera);
      document.querySelector('[data-adjust]')?.addEventListener('click', applyCreditAdjustment);
      document.querySelector('[data-correct]')?.addEventListener('click', correctRedemption);
    }

    async function revealReward() {
      const rewardId = document.querySelector('[data-reveal-reward]').dataset.rewardId;
      try {
        const response = await fetch('/api/rewards/reveal', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ memberId:'patrick', rewardId }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The reward could not be revealed.');
        revealedReward = result;
        message = 'Reward QR ready. Show it to Staff.';
        render(currentView);
      } catch (error) { message = error.message; render(currentView); }
    }

    async function previewRedemption() {
      const accessCode = document.querySelector('#access-code').value;
      const token = document.querySelector('#reward-token').value.trim();
      staffAccessCode = accessCode;
      staffToken = token;
      try {
        const response = await fetch('/api/staff/redemptions/preview', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ accessCode, token }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The Reward QR could not be previewed.');
        staffPreview = result;
        message = 'Review the Redemption, then confirm it.';
        render(currentView);
      } catch (error) { message = error.message; render(currentView); }
    }

    async function confirmRedemption() {
      if (isConfirming) return;
      const accessCode = document.querySelector('#access-code').value;
      const token = document.querySelector('#reward-token').value.trim();
      staffAccessCode = accessCode;
      staffToken = token;
      redemptionRequestId ??= crypto.randomUUID();
      isConfirming = true;
      message = 'Confirming the Redemptionâ€¦';
      render(currentView);
      try {
        const response = await fetch('/api/staff/redemptions', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ accessCode, token, requestId:redemptionRequestId }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The Redemption could not be completed.');
        currentView = result;
        staffPreview = null;
        staffToken = '';
        redemptionRequestId = undefined;
        revealedReward = null;
        message = 'Redemption confirmed. The reward is no longer available.';
      } catch (error) { message = error.message; }
      finally { isConfirming = false; render(currentView); }
    }

    async function scanWithCamera() {
      staffAccessCode = document.querySelector('#access-code').value;
      if (!navigator.mediaDevices?.getUserMedia) {
        message = 'Camera access is unavailable here. Paste the Reward QR value manually.';
        render(currentView);
        return;
      }
      if (!('BarcodeDetector' in window) && !window.jsQR) {
        message = 'The QR scanner is still loading. Try again in a moment, or paste the Reward QR value manually.';
        render(currentView);
        return;
      }
      const video = document.querySelector('#scanner');
      const canvas = document.querySelector('#scanner-canvas');
      const context = canvas.getContext('2d', { willReadFrequently: true });
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
        cameraStream = stream;
        scanActive = true;
        video.srcObject = stream;
        video.hidden = false;
        await video.play();
        const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats:['qr_code'] }) : undefined;
        const scan = async () => {
          if (!scanActive || video.hidden) return;
          try {
            let codes;
            if (detector) {
              codes = await detector.detect(video);
            } else if (video.videoWidth && video.videoHeight) {
              canvas.width = video.videoWidth;
              canvas.height = video.videoHeight;
              context.drawImage(video, 0, 0, canvas.width, canvas.height);
              const image = context.getImageData(0, 0, canvas.width, canvas.height);
              const code = window.jsQR(image.data, image.width, image.height, { inversionAttempts: 'attemptBoth' });
              codes = code ? [{ rawValue: code.data }] : [];
            } else {
              codes = [];
            }
            if (codes[0]?.rawValue) {
              staffToken = codes[0].rawValue;
              stopScanner();
              message = 'Reward QR captured. Preview the Redemption.';
              render(currentView);
              return;
            }
            requestAnimationFrame(scan);
          } catch {
            stopScanner();
            message = 'Camera scanning failed. Paste the Reward QR value manually.';
            render(currentView);
          }
        };
        requestAnimationFrame(scan);
      } catch { stopScanner(); message = 'Camera access failed. Paste the Reward QR value manually.'; render(currentView); }
    }

    function stopScanner() {
      scanActive = false;
      cameraStream?.getTracks().forEach(track => track.stop());
      cameraStream = undefined;
      const video = document.querySelector('#scanner');
      if (video) { video.hidden = true; video.srcObject = null; }
    }

    async function applyCreditAdjustment() {
      if (isAdjusting) return;
      staffAccessCode = document.querySelector('#access-code').value;
      adjustmentAmount = document.querySelector('#adjustment-amount').value;
      adjustmentReason = document.querySelector('#adjustment-reason').value;
      adjustmentRequestId ??= crypto.randomUUID();
      isAdjusting = true;
      render(currentView);
      try {
        const response = await fetch('/api/staff/adjustments', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ memberId:'patrick', accessCode:staffAccessCode, requestId:adjustmentRequestId, amount:Number(adjustmentAmount), reason:adjustmentReason }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The Credit Adjustment could not be saved.');
        currentView = result;
        adjustmentAmount = '';
        adjustmentReason = '';
        adjustmentRequestId = undefined;
        message = 'Credit Adjustment recorded in the ledger.';
      } catch (error) { message = error.message; }
      isAdjusting = false;
      render(currentView);
    }

    async function correctRedemption() {
      if (isCorrecting) return;
      staffAccessCode = document.querySelector('#access-code').value;
      correctionRewardId = document.querySelector('#correction-reward-id').value.trim();
      correctionReason = document.querySelector('#correction-reason').value;
      correctionRequestId ??= crypto.randomUUID();
      isCorrecting = true;
      render(currentView);
      try {
        const response = await fetch('/api/staff/redemption-corrections', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ accessCode:staffAccessCode, rewardId:correctionRewardId, requestId:correctionRequestId, reason:correctionReason }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The Redemption correction could not be saved.');
        currentView = result;
        correctionRewardId = '';
        correctionReason = '';
        correctionRequestId = undefined;
        message = 'Redemption corrected. The original activity remains in history.';
      } catch (error) { message = error.message; }
      isCorrecting = false;
      render(currentView);
    }

    async function recordPaidDrink() {
      if (isRecording) return;
      const accessCode = document.querySelector('#access-code').value;
      staffAccessCode = accessCode;
      isRecording = true;
      message = 'Saving the purchase…';
      render(currentView);
      try {
        const response = await fetch('/api/staff/credits', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ memberId: 'patrick', accessCode, requestId: crypto.randomUUID() })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The purchase could not be recorded.');
        message = 'Recorded. Patrick now has one more Drink Credit.';
        currentView = result;
      } catch (error) {
        message = error.message;
      } finally {
        isRecording = false;
        render(currentView);
      }
    }

    fetch('/api/members/patrick').then(response => {
      if (!response.ok) throw new Error('The Rewards Card could not be loaded.');
      return response.json();
    }).then(render).catch(error => { app.innerHTML = `<div class="error">${esc(error.message)}</div>`; });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" crossorigin="anonymous"></script>
</body>
</html>
