<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252321">
  <title>Bend &amp; Brew Rewards Card</title>
  <style>
    :root { --ink:#252321; --cream:#f8edda; --rust:#b84d32; --muted:#776d61; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px 16px 48px; background:var(--ink); color:var(--cream); font:16px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { max-width:620px; margin:auto; }
    .note { margin:0 auto 18px; color:#cdbda4; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    .ticket { position:relative; padding:32px 26px; background:var(--cream); color:var(--ink); }
    .ticket::before,.ticket::after { content:""; position:absolute; left:0; right:0; height:10px; background:radial-gradient(circle at 5px 0, transparent 5px, var(--ink) 6px) 0 0/18px 10px; }
    .ticket::before { top:-1px; }.ticket::after { bottom:-1px; transform:rotate(180deg); }
    .mast { display:flex; justify-content:space-between; gap:12px; border-bottom:2px dashed currentColor; padding-bottom:18px; }
    .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(54px,18vw,112px)/.85 Georgia, serif; letter-spacing:-.08em; }
    h2 { margin:14px 0 0; font:700 38px/.95 Georgia, serif; letter-spacing:-.05em; }
    .center { text-align:center; }
    .card-qr { width:min(76vw,280px); margin:28px auto 20px; display:block; border:12px solid #fff; background:#fff; }
    .member-hello { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px 0; }
    .member-hello h2 { margin-top:6px; }
    .mini-card-qr { width:82px; height:82px; padding:6px; background:#fff; border:2px solid currentColor; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; border:2px solid currentColor; margin-bottom:24px; }
    .tab { background:transparent; color:inherit; border-radius:0; padding:13px 8px; }
    .tab + .tab { border-left:2px solid currentColor; }
    .tab.active { background:var(--ink); color:var(--cream); }
    .tab-count { display:inline-grid; place-items:center; min-width:22px; height:22px; margin-left:4px; padding:0 5px; border-radius:50%; background:var(--rust); color:#fff; }
    .tab-panel { min-height:360px; }
    .tally { padding:28px 0 20px; border-top:2px dashed currentColor; border-bottom:2px dashed currentColor; }
    .lifetime { border-top:0; padding-top:10px; }
    .tally p { margin:8px 0 0; color:var(--muted); }
    .next-reward { padding:28px 0 10px; }
    .progress { display:flex; gap:7px; justify-content:center; margin-top:20px; }
    .progress span { width:24px; height:24px; border:2px solid currentColor; border-radius:50%; display:grid; place-items:center; font-size:12px; }
    .progress span.filled { background:#e3a43b; }
    .staff-link { display:block; margin-top:24px; color:inherit; text-align:center; }
    .panel { padding-top:26px; }
    label { display:block; margin-top:14px; }
    input { width:100%; padding:13px; border:2px solid currentColor; border-radius:2px; background:#fffaf0; color:var(--ink); font:16px ui-monospace,monospace; }
    button { border:0; border-radius:2px; padding:14px 16px; background:var(--rust); color:#fff; font:700 14px ui-monospace,monospace; cursor:pointer; }
    button.secondary { background:transparent; color:inherit; border:2px solid currentColor; }
    button:disabled { cursor:not-allowed; opacity:.5; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
    .scanner { width:100%; margin-top:18px; background:#171615; }
    .status { margin-top:18px; padding:16px; background:#ead6b7; color:var(--ink); }
    .status.success { background:#b9dec3; color:#173d28; }
    .status.error { background:#f5c8bb; color:#4b1f17; }
    .small { color:var(--muted); font-size:12px; }
    .history { margin-top:24px; padding-top:18px; border-top:2px dashed currentColor; }
    .history p { color:var(--muted); margin:8px 0; }
    .coffee-joke { display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; margin-top:24px; padding:18px; background:#ead6b7; transform:rotate(-.5deg); }
    .coffee-joke > span { font-size:34px; }
    .coffee-joke p { margin:4px 0 0; font:700 18px/1.25 Georgia,serif; }
    .joke-button { grid-column:1/-1; justify-self:start; padding:8px 10px; background:transparent; color:inherit; border:1px solid currentColor; font-size:11px; }
    .wallet-intro { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
    .reward-stamp { display:grid; place-items:center; width:74px; height:74px; border:4px double var(--rust); border-radius:50%; color:var(--rust); font-weight:900; transform:rotate(8deg); }
    .reward-list { display:grid; gap:12px; }
    .reward-card { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px; border:2px dashed currentColor; background:#fff8ea; }
    .reward-card strong { display:block; margin-top:4px; font:700 21px Georgia,serif; }
    .reward-card p { margin:5px 0 0; color:var(--muted); font-size:12px; }
    .reward-card button { flex:0 0 auto; }
    .reward-open { padding-top:12px; }
    .reward-qr { display:block; width:min(72vw,260px); margin:24px auto 18px; padding:10px; border:2px solid currentColor; background:#fff; }
    .reward-timer { max-width:390px; margin:0 auto 20px; color:var(--muted); }
    .empty-wallet { padding:46px 14px; }
    .empty-cup { font-size:52px; }
    @media (max-width:520px) { body { padding:16px 10px 36px; }.ticket { padding:26px 18px; } }
  </style>
</head>
<body>
  <main>
    <p class="note">Bend &amp; Brew · Rewards Card</p>
    <section id="app" class="ticket" aria-live="polite">Loading…</section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" crossorigin="anonymous"></script>
  <script type="module">
    import { memberMarkup, coffeeJokes } from '/member-view.js';

    const app = document.querySelector('#app');
    const isStaff = location.pathname === '/staff';
    const esc = value => String(value).replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character]));
    let currentView;
    let scannerStream;
    let scanActive = false;
    let scanBusy = false;
    let scanRequestId;
    let manualRequestId;
    let pendingCardToken;
    let audioContext;
    let staffAccessCode = sessionStorage.getItem('staffAccessCode') ?? '';
    let activeMemberTab = 'tally';
    let jokeIndex = 0;
    let revealedReward;

    function staffMarkup(view) {
      return `<div class="mast"><strong>BEND &amp; BREW</strong><span>STAFF SCANNER</span></div>
        <div class="panel"><div class="eyebrow">Scan to add one drink</div><h2>Point at Patrick's QR.</h2><p class="small">The scan will beep and add one Drink Credit immediately.</p>
        <label for="staff-pin" class="eyebrow">Staff PIN</label><input id="staff-pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter Staff PIN" value="${esc(staffAccessCode)}">
        <video id="scanner" class="scanner" playsinline hidden></video><canvas id="scanner-canvas" hidden></canvas>
        <div class="actions"><button type="button" data-start>Start scanner</button><button class="secondary" type="button" data-manual>Add Patrick's drink manually</button></div>
        <div id="status" class="status" role="status">Tap Start scanner to allow camera access.</div>
        <div class="tally center"><div class="eyebrow">Patrick's tally</div><h1>${view.lifetimeDrinkCredits}</h1><p>${view.drinkCredits} of 8 toward the next free drink</p></div>
        <a class="staff-link" href="/">Patrick's card</a></div>`;
    }

    function render(view) {
      currentView = view;
      if (revealedReward && !view.availableRewards.some(reward => reward.id === revealedReward.rewardId)) revealedReward = undefined;
      app.innerHTML = isStaff ? staffMarkup(view) : memberMarkup(view, { activeTab:activeMemberTab, jokeIndex, revealedReward });
      if (isStaff) {
        document.querySelector('#staff-pin').addEventListener('input', event => {
          staffAccessCode = event.target.value.trim();
          sessionStorage.setItem('staffAccessCode', staffAccessCode);
        });
        document.querySelector('[data-start]').addEventListener('click', startScanner);
        document.querySelector('[data-manual]').addEventListener('click', recordManualCredit);
      } else {
        document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
          activeMemberTab = button.dataset.tab;
          revealedReward = undefined;
          render(currentView);
        }));
        document.querySelector('[data-new-joke]')?.addEventListener('click', () => {
          jokeIndex = (jokeIndex + 1) % coffeeJokes.length;
          render(currentView);
        });
        document.querySelectorAll('[data-reward-id]').forEach(button => button.addEventListener('click', () => revealReward(button.dataset.rewardId, button)));
        document.querySelector('[data-close-reward]')?.addEventListener('click', () => { revealedReward = undefined; render(currentView); });
      }
    }

    async function revealReward(rewardId, button) {
      button.disabled = true;
      button.textContent = 'Opening…';
      try {
        const response = await fetch('/api/rewards/reveal', {
          method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ rewardId })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The reward could not be opened.');
        revealedReward = result;
        render(currentView);
      } catch (error) {
        button.disabled = false;
        button.textContent = 'Open reward';
        alert(error.message);
      }
    }

    function setStatus(text, kind = '') {
      const status = document.querySelector('#status');
      if (status) { status.textContent = text; status.className = `status ${kind}`; }
    }

    function playBeep() {
      try {
        audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
        audioContext.resume();
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.value = 880;
        gain.gain.setValueAtTime(.18, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .18);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + .18);
      } catch { /* Haptics and the visible success alert remain available. */ }
      navigator.vibrate?.(120);
    }

    async function recordScan(cardToken) {
      if (scanBusy) return;
      if (!staffAccessCode) { setStatus('Enter the Staff PIN before adding a drink.', 'error'); document.querySelector('#staff-pin')?.focus(); return; }
      if (!cardToken) { setStatus('No QR value found. Try the camera again or use manual fallback.', 'error'); return; }
      pendingCardToken ??= cardToken;
      if (pendingCardToken !== cardToken) { pendingCardToken = cardToken; scanRequestId = undefined; }
      scanRequestId ??= crypto.randomUUID();
      scanBusy = true;
      stopScanner();
      setStatus('Saving the drink…');
      try {
        const response = await fetch('/api/staff/scan', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({ cardToken, accessCode:staffAccessCode, requestId:scanRequestId }) });
        const result = await response.json();
        if (!response.ok) {
          if (response.status === 401) {
            staffAccessCode = '';
            sessionStorage.removeItem('staffAccessCode');
            const pin = document.querySelector('#staff-pin');
            if (pin) { pin.value = ''; pin.focus(); }
          }
          throw new Error(result.error || 'The scan could not be recorded.');
        }
        currentView = result;
        render(currentView);
        playBeep();
        setStatus(`Drink added for ${result.member.name}. Tally: ${result.lifetimeDrinkCredits}.`, 'success');
        pendingCardToken = undefined;
        scanRequestId = undefined;
      } catch (error) { setStatus(`${error.message} Tap Add drink or Start scanner to retry.`, 'error'); }
      finally { scanBusy = false; }
    }

    async function recordManualCredit() {
      if (scanBusy) return;
      if (!staffAccessCode) { setStatus('Enter the Staff PIN before adding a drink.', 'error'); document.querySelector('#staff-pin')?.focus(); return; }
      scanBusy = true;
      manualRequestId ??= crypto.randomUUID();
      setStatus('Saving Patrick\'s drink…');
      try {
        const response = await fetch('/api/staff/credits', {
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({ memberId:'patrick', accessCode:staffAccessCode, requestId:manualRequestId })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The drink could not be recorded.');
        currentView = result;
        render(currentView);
        playBeep();
        setStatus(`Drink added for ${result.member.name}. Tally: ${result.lifetimeDrinkCredits}.`, 'success');
        manualRequestId = undefined;
      } catch (error) { setStatus(error.message, 'error'); }
      finally { scanBusy = false; }
    }

    async function startScanner() {
      if (scanActive) return;
      if (!staffAccessCode) { setStatus('Enter the Staff PIN before starting the scanner.', 'error'); document.querySelector('#staff-pin')?.focus(); return; }
      if (!navigator.mediaDevices?.getUserMedia || !window.jsQR) { setStatus('Camera scanning is unavailable. Use manual fallback.', 'error'); return; }
      const video = document.querySelector('#scanner');
      const canvas = document.querySelector('#scanner-canvas');
      const context = canvas.getContext('2d', { willReadFrequently:true });
      try {
        setStatus('Requesting camera permission…');
        audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
        await audioContext.resume();
        try {
          scannerStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
        } catch (error) {
          if (error?.name !== 'TypeError' && error?.name !== 'OverconstrainedError') throw error;
          scannerStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
        }
        scanActive = true;
        video.srcObject = scannerStream;
        video.hidden = false;
        await video.play();
        setStatus('Scanner ready. Point at Patrick\'s QR.');
        const scan = async () => {
          if (!scanActive || video.hidden) return;
          try {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            if (canvas.width && canvas.height) {
              context.drawImage(video, 0, 0, canvas.width, canvas.height);
              const image = context.getImageData(0, 0, canvas.width, canvas.height);
              const code = window.jsQR(image.data, image.width, image.height, { inversionAttempts:'attemptBoth' });
              if (code?.data) { await recordScan(code.data); return; }
            }
            requestAnimationFrame(scan);
          } catch { stopScanner(); setStatus('Camera scanning failed. Use manual fallback.', 'error'); }
        };
        requestAnimationFrame(scan);
      } catch { stopScanner(); setStatus('Camera permission was unavailable. Use manual fallback.', 'error'); }
    }

    function stopScanner() {
      scanActive = false;
      scannerStream?.getTracks().forEach(track => track.stop());
      scannerStream = undefined;
      const video = document.querySelector('#scanner');
      if (video) { video.hidden = true; video.srcObject = null; }
    }

    async function loadMember() {
      const response = await fetch('/api/members/patrick');
      if (!response.ok) throw new Error('The Rewards Card could not be loaded.');
      return response.json();
    }

    loadMember().then(view => { render(view); }).catch(error => { app.innerHTML = `<div class="status error">${esc(error.message)}</div>`; });
    if (!isStaff) setInterval(() => loadMember().then(view => {
      if (JSON.stringify(view) !== JSON.stringify(currentView)) render(view);
    }).catch(() => {}), 2500);
  </script>
</body>
</html>
